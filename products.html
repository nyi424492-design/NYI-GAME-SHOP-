<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <title>NYI GAME SHOP - Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>NYI GAME SHOP</h1>
    </header>

    <div class="category-container">
        <!-- 🎮 Game Top Up -->
        <div class="category-card">
            <h2>🎮 Game Top Up</h2>
            <button class="item-btn" onclick="loadProduct('MLBB Diamond')">MLBB Diamond</button>
            <button class="item-btn" onclick="loadProduct('PUBG UC')">PUBG UC</button>
            <button class="item-btn" onclick="loadProduct('Free Fire Diamond')">Free Fire Diamond</button>
            <button class="item-btn" onclick="loadProduct('Honor of Kings Token')">Honor of Kings Token</button>
            <button class="item-btn" onclick="loadProduct('Blood Strike Credit')">Blood Strike Credit</button>
        </div>

        <!-- 📱 Telegram -->
        <div class="category-card">
            <h2>📱 Telegram Services</h2>
            <button class="item-btn" onclick="loadProduct('Telegram Stars')">Telegram Stars ⭐</button>
            <button class="item-btn" onclick="loadProduct('Premium Subscription')">Premium Subscription</button>
            <button class="item-btn" onclick="loadProduct('Gift/Payment Service')">Gift / Payment Service</button>
        </div>

        <!-- 🎁 Digital Product -->
        <div class="category-card">
            <h2>🎁 Digital Product</h2>
            <button class="item-btn" onclick="loadProduct('Game Account')">Game Account</button>
            <button class="item-btn" onclick="loadProduct('Gift Card')">Gift Card</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
